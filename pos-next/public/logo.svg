<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#0f172a" stroke="url(#grad1)" stroke-width="10" />
  
  <!-- Geometric Icon: Box / Inventory -->
  <g transform="translate(100, 100) scale(0.6)" filter="url(#shadow)">
    <path d="M250 50 L450 150 L450 350 L250 450 L50 350 L50 150 Z" fill="none" stroke="url(#grad1)" stroke-width="25" stroke-linejoin="round" />
    <path d="M50 150 L250 250 L450 150" fill="none" stroke="url(#grad1)" stroke-width="25" stroke-linecap="round" />
    <path d="M250 250 L250 450" fill="none" stroke="url(#grad1)" stroke-width="25" stroke-linecap="round" />
    
    <!-- Barcode Lines -->
    <rect x="180" y="280" width="20" height="80" fill="#38bdf8" />
    <rect x="220" y="280" width="10" height="80" fill="#38bdf8" />
    <rect x="250" y="280" width="30" height="80" fill="#38bdf8" />
    <rect x="300" y="280" width="15" height="80" fill="#38bdf8" />
  </g>
</svg>